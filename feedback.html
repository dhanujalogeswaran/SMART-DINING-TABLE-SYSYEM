<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Feedback</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    background:#f5f5f5;
    font-family:Arial,sans-serif;
}

.container{
    width:450px;
    margin:50px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 10px gray;
}

h1{
    text-align:center;
    color:#ff5722;
}

.rating{
    text-align:center;
    font-size:35px;
    color:gold;
    cursor:pointer;
}

textarea{
    width:100%;
    height:120px;
    margin-top:20px;
    padding:10px;
    border-radius:10px;
    resize:none;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    background:#28a745;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:18px;
}

button:hover{
    background:#218838;
}

</style>

</head>

<body>

<div class="container">

<h1>Customer Feedback</h1>

<p style="text-align:center;">Rate Your Experience</p>

<div class="rating">
⭐⭐⭐⭐⭐
</div>

<textarea
placeholder="Write your feedback here..."></textarea>

<button onclick="submitFeedback()">
Submit Feedback
</button>

</div>

<script>

function submitFeedback(){

alert("🎉 Thank You For Your Valuable Feedback!");

window.location.href="index.html";

}

</script>

</body>
</html>
<button onclick="window.location.href='welcome.html'">
Back to Home
</button>
