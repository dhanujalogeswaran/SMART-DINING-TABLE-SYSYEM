<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment</title>

<link rel="stylesheet" href="style.css">

<style>

body{
background:#f5f5f5;
font-family:Arial,sans-serif;
}

.container{
width:400px;
margin:50px auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 0 10px gray;
text-align:center;
}

img{
width:220px;
height:220px;
margin:20px 0;
}

h1{
color:#ff5722;
}

button{
padding:12px 25px;
background:#28a745;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
font-size:18px;
}

button:hover{
background:#218838;
}

</style>

</head>

<body>

<div class="container">

<h1>Payment</h1>

<h2>Total Amount: ₹860</h2>

<img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=SmartDiningPayment" alt="QR Code">

<p>Scan the QR Code and Complete the Payment.</p>

<button onclick="paymentSuccess()">
Payment Completed
</button>

</div>

<script>

function paymentSuccess(){

alert("✅ Payment Successful!");

window.location.href="index.html";

}

</script>

</body>
</html>
<button onclick="window.location.href='kitchen.html'">
Payment Completed
</button>
