<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurant Bill</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
}

.bill{
    width:500px;
    margin:40px auto;
    background:#fff;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    color:#ff5722;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

table th,table td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

th{
    background:#ff5722;
    color:white;
}

.total{
    margin-top:20px;
    text-align:right;
    font-size:20px;
    font-weight:bold;
}

button{
    width:100%;
    margin-top:20px;
    padding:12px;
    background:#28a745;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#218838;
}

</style>

</head>

<body>

<div class="bill">

<h1>🧾 Restaurant Bill</h1>

<table>

<tr>
<th>Food</th>
<th>Qty</th>
<th>Price</th>
</tr>

<tr>
<td>Chicken Biryani</td>
<td>2</td>
<td>₹360</td>
</tr>

<tr>
<td>Burger</td>
<td>1</td>
<td>₹150</td>
</tr>

<tr>
<td>Fresh Juice</td>
<td>2</td>
<td>₹180</td>
</tr>

</table>

<div class="total">
Subtotal : ₹690 <br>
GST (5%) : ₹35 <br>
Grand Total : ₹725
</div>

<button onclick="printBill()">Print Bill</button>

</div>

<script>

function printBill(){
    window.print();
}

</script>

</body>
</html>
<button onclick="window.location.href='payment.html'">
Proceed to Payment
</button>
