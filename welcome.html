<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to Restaurant</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff5722,#ff9800);
}

.container{
background:white;
padding:40px;
border-radius:20px;
text-align:center;
box-shadow:0 5px 20px rgba(0,0,0,0.3);
width:400px;
}

h1{
color:#ff5722;
margin-bottom:15px;
}

p{
font-size:18px;
margin-bottom:20px;
color:#555;
}

img{
width:180px;
margin-bottom:20px;
}

button{
padding:12px 30px;
font-size:18px;
background:#ff5722;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#e64a19;
}

</style>
</head>

<body>

<div class="container">

<img src="https://cdn-icons-png.flaticon.com/512/3075/3075977.png" alt="Restaurant">

<h1>🍽️ Welcome to Smart Dining Restaurant</h1>

<p>Scan the QR Code and Enjoy Digital Dining Experience.</p>

</button>
<button onclick="window.location.href='index.html'">
    View Menu
</button>

</div>

<script>

function openMenu(){
window.location.href="index.html";
}

</script>

</body>
</html>
